name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: SFTP integration test
        run: |
          python3 -m venv "$RUNNER_TEMP/sp-ultra-venv"
          "$RUNNER_TEMP/sp-ultra-venv/bin/python" -m pip install --disable-pip-version-check paramiko
          mkdir -p "$RUNNER_TEMP/sp-ultra-sftp"
          "$RUNNER_TEMP/sp-ultra-venv/bin/python" scripts/mock-sftp-server.py --port 2222 --root "$RUNNER_TEMP/sp-ultra-sftp" > "$RUNNER_TEMP/sp-ultra-sftp.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            nc -z 127.0.0.1 2222 && break
            sleep 1
          done
          nc -z 127.0.0.1 2222 || { cat "$RUNNER_TEMP/sp-ultra-sftp.log"; exit 1; }
          SPULTRA_TEST_HOST=127.0.0.1 \
          SPULTRA_TEST_PORT=2222 \
          SPULTRA_TEST_USER=mock \
          SPULTRA_TEST_PASSWORD=mock \
          SPULTRA_TEST_REMOTE_DIR=/tmp \
          SPULTRA_TEST_SFTP=1 \
          swift test --filter NativeSSHIntegrationTests/testNativeSFTPCreateAndRoundTripWhenEnvironmentIsConfigured

      - name: Release build (arm64)
        run: swift build -c release --arch arm64
