name: 功能建议
description: 提出改进或新能力
title: "[功能] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 SP Ultra。较大的改动请描述你希望完成的工作流，
        而不只是设想的界面。
  - type: textarea
    id: problem
    attributes:
      label: 问题或使用场景
      description: 你想完成什么？目前哪里不顺手？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望它如何工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 现有绕过方式、其他软件或更简单的方案。
  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      options:
        - 文件传输
        - 会话管理
        - 连接 / 认证
        - SCP 兼容性
        - MCP
        - 性能
        - 文档
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      options:
        - label: 我已搜索过现有 Issue，确认不是重复建议。
          required: true
